# Builds Markshot and runs the test suites (tests\run.ps1) on every push to main and on pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Tests
        shell: pwsh
        run: ./tests/run.ps1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: tests/out/
